{% load static %} <!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>MF AI Manuals</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <link rel="apple-touch-icon" href="{% static 'images/app-icon.png' %}">
    <style>
      body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial;}
      .container{max-width:880px;margin:32px auto;padding:0 16px;}
      header{margin-bottom:24px}
      input[type="text"]{width:100%;padding:10px;font-size:16px}
      .btn{display:inline-block;padding:10px 16px;border:1px solid #333;border-radius:8px;background:#fff;cursor:pointer}
      .btn-primary{background:#111;color:#fff;border-color:#111}
      .card{border:1px solid #ddd;border-radius:10px;padding:16px;margin:16px 0}
      .muted{color:#666}
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>家電マニュアル RAG</h1>
      </header>
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
